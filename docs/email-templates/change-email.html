<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#F3F1EC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F1EC;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr><td style="padding:0 4px 20px;font-size:26px;font-weight:800;letter-spacing:0.5px;color:#121212;">UNFNSHD</td></tr>
          <tr><td style="background:#FFFFFF;border:1px solid #CFCBC2;border-radius:20px;padding:28px 24px;">
            <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;color:#121212;">Confirm your new email</h1>
            <p style="margin:0 0 14px;font-size:16px;line-height:1.5;color:#121212;">Tap the button to confirm this as the new email for your UNFNSHD account.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 18px;"><tr><td style="background:#2E6B57;border-radius:999px;">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;">Confirm new email</a>
            </td></tr></table>
            <p style="margin:0;font-size:14px;line-height:1.5;color:#55534E;">If you didn't ask for this change, you can ignore this email and nothing changes.</p>
          </td></tr>
          <tr><td style="padding:18px 4px 0;font-size:13px;line-height:1.5;color:#55534E;">We aren't done. unfnshd.app</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
