<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F2EA" />
    <meta name="apple-mobile-web-app-title" content="UNFNSHD" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iPhone/iPad only: stop Safari zooming in when a text box is tapped. iOS still
      // allows pinch zoom with this set; Android would block it, so it is not applied there.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover')
      }
    </script>
    <script>
      // Light or dark mode before the first paint, so the screen never flashes the wrong
      // colours. A choice made in Settings wins; otherwise follow the phone. See src/theme.js.
      (function () {
        var t = null
        try { t = localStorage.getItem('unfnshd-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#141311' : '#F7F2EA')
      })()
    </script>
    <title>UNFNSHD: keep every client you coach</title>
    <meta name="description" content="Coaching software for personal trainers. See who is slipping and why, send the right message, and run programs, check-ins and nutrition in one app. Free for founding coaches while in beta." />
    <meta property="og:title" content="UNFNSHD: keep every client you coach" />
    <meta property="og:description" content="See who is slipping and why, and send the right message. Programs, check-ins, nutrition and a client app in one place." />
    <meta property="og:image" content="https://unfnshd.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://unfnshd.app/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
