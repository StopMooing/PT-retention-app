<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2E6B57" />
    <meta name="apple-mobile-web-app-title" content="UNFNSHD" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iPhone/iPad only: stop Safari zooming in when a text box is tapped. iOS still
      // allows pinch zoom with this set; Android would block it, so it is not applied there.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0')
      }
    </script>
    <title>UNFNSHD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
