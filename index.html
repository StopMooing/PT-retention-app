<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F3F1EC" />
    <meta name="apple-mobile-web-app-title" content="UNFNSHD" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iPhone/iPad only: stop Safari zooming in when a text box is tapped. iOS still
      // allows pinch zoom with this set; Android would block it, so it is not applied there.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0')
      }
    </script>
    <script>
      // Light or dark mode before the first paint, so the screen never flashes the wrong
      // colours. A choice made in Settings wins; otherwise follow the phone. See src/theme.js.
      (function () {
        var t = null
        try { t = localStorage.getItem('unfnshd-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#121212' : '#F3F1EC')
      })()
    </script>
    <title>UNFNSHD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
